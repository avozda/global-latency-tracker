# fly.toml app configuration file generated for global-latency-tracker-probe-sin on 2026-05-31T22:35:34Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'global-latency-tracker-probe-sin'
primary_region = 'sin'

[build]
  dockerfile = 'deploy/Dockerfile.probe'

[env]
  HUB_URL = 'https://global-latency-tracker.onrender.com'
  PROBE_INTERVAL = '60s'
  PROBE_REGION = 'Asia'
  PROBE_TARGET_URL = 'https://api.spacexdata.com/v4/launches'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
