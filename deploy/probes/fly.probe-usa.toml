# fly.toml app configuration file generated for global-latency-tracker-probe-lax on 2026-06-01T08:51:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'global-latency-tracker-probe-lax'
primary_region = 'lax'

[build]
  dockerfile = '../Dockerfile.probe'

[env]
  HUB_URL = 'https://global-latency-tracker.onrender.com'
  PROBE_INTERVAL = '60s'
  PROBE_REGION = 'US-West'
  PROBE_TARGET_URL = 'https://www.ethz.ch'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
