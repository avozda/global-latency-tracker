app = 'global-latency-tracker-probe-jnb'
primary_region = 'jnb'

[build]
  dockerfile = '../Dockerfile.probe'

[env]
  HUB_URL = 'https://global-latency-tracker.onrender.com'
  PROBE_INTERVAL = '60s'
  PROBE_REGION = 'Africa'
  PROBE_TARGET_URL = 'https://www.ethz.ch/de.html'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
