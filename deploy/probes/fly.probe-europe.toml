app = 'global-latency-tracker-probe-ams'
primary_region = 'ams'

[build]
  dockerfile = '../Dockerfile.probe'

[env]
  HUB_URL = 'https://global-latency-tracker.onrender.com'
  PROBE_INTERVAL = '60s'
  PROBE_REGION = 'Europe'
  PROBE_TARGET_URL = 'https://www.ethz.ch'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
