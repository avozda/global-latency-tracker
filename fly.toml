# fly.toml app configuration file generated for global-latency-tracker on 2026-05-31T22:28:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'global-latency-tracker'
primary_region = 'iad'

[build]
  [build.args]
    GO_VERSION = '1.26.3'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
